version: '3.8'

services:
  backend:
    build:
      context: ./backend
      args:
        no_cache: "true"
    command: sh -c "python manage.py collectstatic --noinput && python manage.py makemigrations && python manage.py migrate --no-input && gunicorn conf.wsgi:application -b 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=backend.conf.settings
      - MONGO_HOST=mongo

    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    # volumes:
    #   - ./frontend/vue-app:/app
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    

  nginx:
    image: nginx:latest
    container_name: nginx
    command: sh -c "nginx -g 'daemon off;'"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
      

volumes:
  mongo_data: