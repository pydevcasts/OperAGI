version: '3.8'

services:
  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py makemigrations &&
             python manage.py migrate --no-input &&
             gunicorn conf.wsgi:application -b 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=conf.settings
      - POSTGRES_DB=operagi
      - POSTGRES_USER=operagi
      - POSTGRES_PASSWORD=operagi
      - POSTGRES_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      retries: 3
    networks:
      - operagi_network

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend/vue-app:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      retries: 3
    networks:
      - operagi_network

  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_DB=operagi
      - POSTGRES_USER=operagi
      - POSTGRES_PASSWORD=operagi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operagi -d operagi"]
      interval: 30s
      retries: 3
    networks:
      - operagi_network

  nginx:
    image: nginx:latest
    container_name: nginx
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      retries: 3
    networks:
      - operagi_network

volumes:
  postgres_data:

networks:
  operagi_network:
    driver: bridge
