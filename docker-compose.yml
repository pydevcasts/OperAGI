version: '3.8'

services:
  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py collectstatic --noinput &&  
             python manage.py makemigrations &&  
             python manage.py migrate --no-input &&  
             gunicorn conf.wsgi:application -b 0.0.0.0:8000 --timeout 120"  
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    # environment:
    #   - DJANGO_SETTINGS_MODULE=conf.settings
    #   - POSTGRES_DB=operagi
    #   - POSTGRES_USER=operagi
    #   - POSTGRES_PASSWORD=operagi
    #   - POSTGRES_HOST=postgres
    env_file:
      - .env  # Load environment variables from .env file
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://backend:8000/health/"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s 
    networks:
      - operagi_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    # environment:
    #   - NODE_ENV=production
    env_file:
      - .env  # Load environment variables from .env file
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - operagi_network

  postgres:
    image: postgres:15
    restart: always
    # environment:
    #   - POSTGRES_DB=operagi
    #   - POSTGRES_USER=operagi
    #   - POSTGRES_PASSWORD=operagi
    env_file:
      - .env  # Load environment variables from .env file
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operagi -d operagi"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - operagi_network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"  # Add HTTPS support
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs  # SSL certificates
      - ./backend/staticfiles:/app/staticfiles  # Mount staticfiles directory  
    depends_on:
      - frontend
      - backend
    networks:
      - operagi_network

volumes:
  postgres_data:

networks:
  operagi_network:
    driver: bridge