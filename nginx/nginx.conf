events {
    worker_connections 1024;
}

http {
    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name operagi.com www.operagi.com;
        return 301 https://$host$request_uri;  # ریدایرکت به HTTPS
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name operagi.com www.operagi.com;

        # SSL configuration
        ssl_certificate /etc/nginx/certs/fullchain.pem;  # تغییر به fullchain.pem
        ssl_certificate_key /etc/nginx/certs/privkey.pem;  # تغییر به privkey.pem

        # Improve SSL security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Static files
        location /static/ {
            alias /app/staticfiles/;
        }

        # Media files
        location /media/ {
            alias /app/media/;
        }

        # Backend (Django API)
        location /api/ {
            proxy_pass http://backend:8000;  # پروکسی به بک‌اند
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (Vue.js app)
        location / {
            proxy_pass http://frontend:3000;  # پروکسی به فرانت‌اند
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
